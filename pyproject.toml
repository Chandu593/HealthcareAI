[project]
name = "federated-multimodal-eicu"
version = "0.1.0"
description = "Federated Multimodal Graph Learning for Mortality and Sepsis Prediction using eICU"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
